name: Bug report
description: Something in Osmium does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Before you start:

        - **Security problems** (for example a crafted archive that writes outside the destination folder, or a weakness in the encryption or the cluster) must not be reported here. Follow the [security policy](https://github.com/windfastt/osmium/security/policy) instead.
        - **Never attach private files or archives.** Describe the files instead (kind, number, total size).
        - **Remove personal information** from everything you paste: user names, computer names, IP addresses, folder paths that contain your name, passwords and cluster keys.
        - Search the [existing issues](https://github.com/windfastt/osmium/issues?q=is%3Aissue) first.

  - type: input
    id: version
    attributes:
      label: Osmium version
      description: Run `osmium version`, or use the version in the name of the file you downloaded. If you built Osmium from source, give the commit.
      placeholder: "0.1.1"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Shown by `winver` or in Settings > System > About.
      placeholder: "Windows 11 24H2 (build 26100)"
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - x64
        - ARM64
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: How Osmium was installed
      options:
        - Installer, for the current user
        - Installer, for all users
        - Portable ZIP
        - Command-line tool only (single file)
        - Built from source
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: How it was run
      description: Choose every part that is involved.
      multiple: true
      options:
        - App (window or tray menu)
        - Explorer menu
        - Command line (osmium)
        - Watch folders
        - Cluster (several PCs)
        - Installer or uninstaller
    validations:
      required: true

  - type: input
    id: profile
    attributes:
      label: Profile and options
      description: The profile and any settings you changed, or the full command with passwords and keys removed.
      placeholder: 'osmium a backup.osa D:\data --profile ultra'

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, step by step. Describe the files involved instead of attaching them.
      placeholder: |
        1. In Explorer, select a folder with about 200 text files (300 MB in total).
        2. Choose Osmium > Compress to .osa (Ultra).
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happened instead, with the exact error message.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and output
      description: |
        The app's Log page shows recent messages; log files are in `%LOCALAPPDATA%\Osmium\logs` (portable copy: `data\local\logs` next to the program). For the command line, run the command again with the environment variable `OSMIUM_DEBUG=1` set to get full error details. Remove personal information (user names, computer names, IP addresses, personal paths, private file names, passwords, cluster keys) before pasting.
      render: text

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before you submit
      options:
        - label: This is not a security vulnerability.
          required: true
        - label: I removed personal information from this report and attached no private files.
          required: true
