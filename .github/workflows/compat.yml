name: Compatibility

# Osmium 0.1.1, built from its own tag, must open, test and extract bit for bit every archive this version writes with
# the methods 0.1.1 knows, spare copies of the file list included, and encrypted archives with Compatible protection;
# it must refuse, and say why, an archive with blocks made with a method that is new since, and an encrypted archive
# with the default protection (Argon2id), writing nothing. This version must extract the encrypted archives of 0.1.1.
# ZIP files this version writes must pass unzip and 7-Zip.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  compat:
    name: Osmium 0.1.1 reads what this version writes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Not a secret: the password of the test archives. It goes in on standard input, never on a command line.
      COMPAT_PASSWORD: compat-test-archives-only
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: v0.1.1
          path: old
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Publish this version's command line and 0.1.1's
        run: |
          set -euo pipefail
          dotnet publish src/Osmium.Cli -c Release -o "$RUNNER_TEMP/new"
          (cd old && dotnet publish src/Osmium.Cli -c Release -o "$RUNNER_TEMP/old")
          "$RUNNER_TEMP/new/osmium" version
          "$RUNNER_TEMP/old/osmium" version | grep -q '^osmium 0\.1\.1$' || { echo "::error::the old command line is not Osmium 0.1.1"; exit 1; }

      - name: Archives of this version, opened, tested and extracted by 0.1.1
        run: |
          set -euo pipefail
          NEW="$RUNNER_TEMP/new/osmium" OLD="$RUNNER_TEMP/old/osmium" W="$RUNNER_TEMP/positive"
          fail() { echo "::error::$1"; exit 1; }
          mkdir -p "$W/in/mixed/sub/deeper" "$W/in/empty" "$W/in/many" "$W/in/dedup" "$W/in/small-random"
          head -c 3M /dev/urandom > "$W/in/mixed/random.bin"            # 3 MiB that do not compress: spare copies
          for i in $(seq 1 200); do echo "line $i of a text file"; done > "$W/in/mixed/notes.txt"
          printf 'short\n' > "$W/in/mixed/sub/short.txt"
          : > "$W/in/mixed/sub/zero.bin"
          seq 1 50000 > "$W/in/mixed/sub/deeper/numbers.txt"
          for i in $(seq 1 5000); do echo "small file $i" > "$W/in/many/f$i.txt"; done
          head -c 1M /dev/urandom > "$W/in/dedup/one.bin"
          cp "$W/in/dedup/one.bin" "$W/in/dedup/two.bin"
          cp "$W/in/dedup/one.bin" "$W/in/dedup/three.bin"
          # 10,000 files of 200 bytes that do not compress: 2 MB of blocks, but a file list well over 2 % of them.
          python3 -I -c 'import os, sys; [open(os.path.join(sys.argv[1], f"r{i:05d}.bin"), "wb").write(os.urandom(200)) for i in range(10000)]' "$W/in/small-random"

          # name, input folder, pipeline (methods 0.1.1 knows), encrypted, spare copies expected (yes, no, rule)
          cases="mixed-zstd mixed zstd(level=3) no yes
          mixed-lzma mixed lzma(dict=16M) no yes
          mixed-encrypted mixed zstd(level=3) yes yes
          empty empty zstd(level=3) no rule
          many many zstd(level=3) no rule
          dedup dedup zstd(level=3) no yes
          small-random small-random zstd(level=3) no no"

          while read -r name folder pipeline encrypted expected; do
            archive="$W/$name.osa"
            if [ "$encrypted" = yes ]; then
              # Compatible protection (PBKDF2, kdf 1) is what 0.1.1 can open; 100,000 iterations is the least Osmium writes.
              printf '%s\n' "$COMPAT_PASSWORD" | "$NEW" a "$archive" "$W/in/$folder" --pipeline "$pipeline" --password-stdin \
                --protection compatible --kdf-iterations 100000 --quiet || fail "$name.osa: this version could not write it"
              python3 -I -c 'import sys; b = open(sys.argv[1], "rb").read(); sys.exit(0 if b[36] == 1 and b[38] == 1 else 1)' "$archive" \
                || fail "$name.osa: it is not protected with PBKDF2 (kdf 1)"
            else
              "$NEW" a "$archive" "$W/in/$folder" --pipeline "$pipeline" --quiet || fail "$name.osa: this version could not write it"
            fi

            # The writer's default rule, read from the archive's own bytes: spare copies exactly when the blocks total
            # 1 MiB or more and the index frame is at most 2 % of them. The footer (last 32 bytes) gives the index
            # frame's offset and length; a header copy's trailer ends at that offset ("OHDR" first).
            python3 -I - "$archive" "$expected" <<'PY' || fail "$name.osa: spare copies are not where the rule puts them"
          import struct, sys
          path, expected = sys.argv[1], sys.argv[2]
          b = open(path, "rb").read()
          index_offset, index_length = struct.unpack_from("<qq", b, len(b) - 32)
          header = 40 + struct.unpack_from("<I", b, 32)[0]
          spares = b[index_offset - 32:index_offset - 28] == b"OHDR"
          if spares:
              header_copy = sum(struct.unpack_from("<qq", b, index_offset - 24)) + 32
              blocks = index_offset - header_copy - index_length - header
          else:
              blocks = index_offset - header
          rule = blocks >= 1 << 20 and index_length * 50 <= blocks
          print(f"{path}: {blocks:,} bytes of blocks, index frame {index_length:,} bytes, spare copies: {'yes' if spares else 'no'}")
          ok = spares == rule and (expected == "rule" or spares == (expected == "yes"))
          if expected == "no":
              ok = ok and blocks >= 1 << 20  # the case is there for a large file list next to 1 MiB of blocks or more
          sys.exit(0 if ok else 1)
          PY

            out="$W/out-$name"
            if [ "$encrypted" = yes ]; then
              printf '%s\n' "$COMPAT_PASSWORD" | "$OLD" t "$archive" --password-stdin || fail "$name.osa: Osmium 0.1.1 did not test it"
              printf '%s\n' "$COMPAT_PASSWORD" | "$OLD" x "$archive" "$out" --password-stdin || fail "$name.osa: Osmium 0.1.1 did not extract it"
            else
              "$OLD" t "$archive" || fail "$name.osa: Osmium 0.1.1 did not test it"
              "$OLD" x "$archive" "$out" || fail "$name.osa: Osmium 0.1.1 did not extract it"
            fi
            diff -r "$W/in/$folder" "$out/$folder" || fail "$name.osa: what Osmium 0.1.1 extracted differs from the source"
            hashes() { (cd "$1" && find . -type f -print0 | sort -z | xargs -0 -r sha256sum); }
            cmp <(hashes "$W/in/$folder") <(hashes "$out/$folder") || fail "$name.osa: SHA-256 of the extracted files differ"
            echo "$name.osa: Osmium 0.1.1 tested and extracted it exactly"
          done <<< "$cases"

      - name: Archives with methods new since 0.1.1 are refused whole by 0.1.1, with the reason
        run: |
          set -euo pipefail
          if [ ! -d src/Osmium.Core/Codecs/Cm2 ]; then echo "Not active yet: this version has no methods that 0.1.1 lacks."; exit 0; fi
          NEW="$RUNNER_TEMP/new/osmium" OLD="$RUNNER_TEMP/old/osmium" W="$RUNNER_TEMP/negative"
          fail() { echo "::error::$1"; exit 1; }
          mkdir -p "$W/in/program"
          cp "$RUNNER_TEMP/new/osmium" "$W/in/program/"   # an x64 executable: the default profile gives it new methods
          "$NEW" a "$W/new-methods.osa" "$W/in/program" --quiet || fail "new-methods.osa: this version could not write it"
          "$NEW" info "$W/new-methods.osa" | tee "$W/info.txt"
          grep -Eq 'x86v2|cm2' "$W/info.txt" || fail "new-methods.osa: no block uses a method new since 0.1.1"

          code=0
          "$OLD" x "$W/new-methods.osa" "$W/old-out" 2> "$W/old.txt" || code=$?
          cat "$W/old.txt"
          [ "$code" -eq 1 ] || fail "new-methods.osa: Osmium 0.1.1 exited with $code, not 1"
          grep -qF 'not supported by this version of Osmium (archive made by a newer version?)' "$W/old.txt" \
            || fail "new-methods.osa: Osmium 0.1.1 did not say that a newer version made it"
          if [ -e "$W/old-out" ] && [ -n "$(ls -A "$W/old-out")" ]; then fail "new-methods.osa: Osmium 0.1.1 wrote files"; fi

          "$NEW" x "$W/new-methods.osa" "$W/new-out" || fail "new-methods.osa: this version did not extract it"
          diff -r "$W/in/program" "$W/new-out/program" || fail "new-methods.osa: what this version extracted differs from the source"

      - name: Encrypted archives with the default protection (Argon2id) are refused by 0.1.1, with its reason
        run: |
          set -euo pipefail
          NEW="$RUNNER_TEMP/new/osmium" OLD="$RUNNER_TEMP/old/osmium" W="$RUNNER_TEMP/argon2id"
          fail() { echo "::error::$1"; exit 1; }
          mkdir -p "$W/in/sub" "$W/make"
          seq 1 20000 > "$W/in/numbers.txt"
          head -c 300K /dev/urandom > "$W/in/sub/random.bin"
          # Written through the archive builder the command line uses, with the default protection and nothing else set.
          { echo "#:project $GITHUB_WORKSPACE/src/Osmium.Core/Osmium.Core.csproj"; cat <<'CS'; } > "$W/make/make-encrypted.cs"
          #:property PublishAot=false
          using Osmium.Core.Planning;
          string password = Console.In.ReadLine() ?? throw new InvalidOperationException("no password on standard input");
          var plan = await new Planner(new PlanOptions { Profile = Profile.ByName("fast"), ForcedPipeline = "zstd(level=3)" })
              .BuildAsync(Scanner.Scan([args[1]]), CancellationToken.None);
          await ArchiveBuilder.BuildAsync(plan, new BuildOptions { OutputPath = args[0], Password = password }, CancellationToken.None);
          CS
          printf '%s\n' "$COMPAT_PASSWORD" | dotnet run "$W/make/make-encrypted.cs" -- "$W/default.osa" "$W/in" \
            || fail "default.osa: this version could not write it"
          # The header asks for Argon2id (kdf 2), Standard (2 passes, 1 GiB, 4 lanes), with flags 0x0001: no flag of its own.
          python3 -I - "$W/default.osa" <<'PY' || fail "default.osa: its header is not Argon2id Standard with flags 0x0001"
          import struct, sys
          b = open(sys.argv[1], "rb").read()
          flags = struct.unpack_from("<I", b, 12)[0]
          print(f"flags 0x{flags:04x}, record 1: {b[36:44].hex(' ')}")
          sys.exit(0 if flags == 1 and b[36:44] == bytes([1, 0x37, 2, 2, 0x80, 0x80, 0x40, 4]) else 1)
          PY

          for cmd in x t l info; do
            out="$W/old-out-$cmd" code=0
            if [ "$cmd" = x ]; then
              printf '%s\n' "$COMPAT_PASSWORD" | "$OLD" x "$W/default.osa" "$out" --password-stdin > "$W/old-$cmd.txt" 2> "$W/old-$cmd.err" || code=$?
            else
              printf '%s\n' "$COMPAT_PASSWORD" | "$OLD" "$cmd" "$W/default.osa" --password-stdin > "$W/old-$cmd.txt" 2> "$W/old-$cmd.err" || code=$?
            fi
            cat "$W/old-$cmd.err"
            [ "$code" -eq 1 ] || fail "default.osa: osmium $cmd of 0.1.1 exited with $code, not 1"
            [ "$(cat "$W/old-$cmd.err")" = "error: Unsupported key-derivation function." ] \
              || fail "default.osa: osmium $cmd of 0.1.1 did not say \"error: Unsupported key-derivation function.\""
            if [ -e "$out" ]; then fail "default.osa: osmium $cmd of 0.1.1 wrote something"; fi
          done

          printf '%s\n' "$COMPAT_PASSWORD" | "$NEW" x "$W/default.osa" "$W/new-out" --password-stdin || fail "default.osa: this version did not extract it"
          diff -r "$W/in" "$W/new-out/in" || fail "default.osa: what this version extracted differs from the source"

      - name: Encrypted archives of 0.1.1 are extracted by this version, bit for bit
        run: |
          set -euo pipefail
          NEW="$RUNNER_TEMP/new/osmium" OLD="$RUNNER_TEMP/old/osmium" W="$RUNNER_TEMP/old-to-new"
          fail() { echo "::error::$1"; exit 1; }
          mkdir -p "$W/in/sub"
          for i in $(seq 1 300); do echo "line $i of an old archive"; done > "$W/in/notes.txt"
          head -c 2M /dev/urandom > "$W/in/sub/random.bin"
          # 0.1.1's own default: PBKDF2 with 600,000 iterations.
          printf '%s\n' "$COMPAT_PASSWORD" | "$OLD" a "$W/old.osa" "$W/in" --password-stdin --quiet || fail "old.osa: Osmium 0.1.1 could not write it"
          printf '%s\n' "$COMPAT_PASSWORD" | "$NEW" t "$W/old.osa" --password-stdin || fail "old.osa: this version did not test it"
          printf '%s\n' "$COMPAT_PASSWORD" | "$NEW" x "$W/old.osa" "$W/out" --password-stdin || fail "old.osa: this version did not extract it"
          hashes() { (cd "$1" && find . -type f -print0 | sort -z | xargs -0 -r sha256sum); }
          cmp <(hashes "$W/in") <(hashes "$W/out/in") || fail "old.osa: SHA-256 of the extracted files differ"
          echo "old.osa: this version tested and extracted the encrypted archive of 0.1.1 exactly"

      - name: ZIP files of this version, checked by unzip and 7-Zip
        run: |
          set -euo pipefail
          if ! command -v unzip > /dev/null || ! command -v 7z > /dev/null; then
            { sudo apt-get update -q && sudo apt-get install -y -q unzip p7zip-full; } \
              || { echo "::error::unzip and 7-Zip (p7zip-full) could not be installed"; exit 1; }
          fi
          OSMIUM_REQUIRE_INTEROP=1 dotnet test -c Release --project tests/Osmium.Core.Tests -- --filter-trait "Category=ZipInterop"
