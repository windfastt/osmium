name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach a build of this commit to an existing release, e.g. v0.1.1 (leave empty for a normal CI run)'
        required: false
        default: ''
      screenshots:
        description: 'Publish the UI self-test screenshots to the "screenshots" branch (for tools/site/fetch_screenshots.py)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  linux:
    name: Build & test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet build Osmium.sln -c Release
      - run: dotnet test -c Release --project tests/Osmium.Core.Tests
      - run: dotnet test -c Release --project tests/Osmium.Desktop.Tests
      - run: dotnet test -c Release --project tests/Osmium.Cli.Tests
      - name: Product page matches tools/site (python3 tools/site/build.py regenerates it)
        run: python3 tools/site/build.py --check
      - name: Settings reference matches the code (tools/settingsdoc regenerates docs/SETTINGS.md)
        run: dotnet run --project tools/settingsdoc -c Release -- --check

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SCREENSHOTS: ${{ inputs.screenshots }}
        run: |
          $base = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Select-Object -First 1
          if ($env:RELEASE_TAG -match '^v\d') { $v = $env:RELEASE_TAG.Substring(1) }
          elseif ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.Substring(1) }
          elseif ($env:SCREENSHOTS -eq 'true') { $v = $base }   # screenshots for the product page show the plain version
          else { $v = "$base-ci.$env:GITHUB_RUN_NUMBER" }
          "VER=$v" >> $env:GITHUB_ENV

      - name: Build
        run: dotnet build Osmium.sln -c Release -p:Version=${{ env.VER }}

      # Same tests as Linux, on Windows: includes the CM golden hash, proving byte-identical output across OSes.
      # (pwsh only fails a step on the last command's exit code, so each one is checked.)
      - name: Test
        if: matrix.arch == 'x64'
        run: |
          dotnet test -c Release --project tests/Osmium.Core.Tests; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet test -c Release --project tests/Osmium.Desktop.Tests; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet test -c Release --project tests/Osmium.Cli.Tests; if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Publish, portable ZIP, installer
        shell: pwsh
        run: ./build/publish.ps1 -Arch ${{ matrix.arch }} -Version $env:VER

      # Real work on a generated sample folder (Analyze, a max job, Lab, Tune), every page and dialog rendered to PNG
      # with manifest.json / manifest-dark.json; the screenshots job below publishes them for the product page.
      - name: UI self-test (real work, every page and dialog, light and dark)
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 30
        run: |
          $exe = "artifacts/publish/win-x64/Osmium.App.exe"
          foreach ($mode in @('', 'dark')) {
            $argv = @('--selftest-ui', 'artifacts/selftest') + @($mode | Where-Object { $_ })
            $p = Start-Process -FilePath $exe -ArgumentList $argv -Wait -PassThru
            $log = if ($mode) { "artifacts/selftest/selftest-$mode.log" } else { 'artifacts/selftest/selftest.log' }
            if (Test-Path $log) { Get-Content $log } else { Write-Host "::warning::$log was not written" }
            if ($p.ExitCode -ne 0) { throw "UI self-test failed ($mode): exit $($p.ExitCode)" }
          }
          Get-ChildItem artifacts/selftest | Format-Table Name, Length

      - name: CLI smoke test (compress, test, extract, compare)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $cli = "artifacts/publish/win-x64/osmium.exe"
          New-Item -ItemType Directory -Force smoke/in/sub | Out-Null
          Copy-Item README.md, docs/*.md smoke/in/
          Copy-Item artifacts/publish/win-x64/Osmium.Core.dll smoke/in/sub/
          & $cli a smoke/test.osa smoke/in --profile max; if ($LASTEXITCODE) { throw 'compress failed' }
          & $cli t smoke/test.osa; if ($LASTEXITCODE) { throw 'test failed' }
          & $cli x smoke/test.osa smoke/out; if ($LASTEXITCODE) { throw 'extract failed' }
          $a = Get-ChildItem -Recurse -File smoke/in | ForEach-Object { (Get-FileHash $_.FullName).Hash } | Sort-Object
          $b = Get-ChildItem -Recurse -File smoke/out/in | ForEach-Object { (Get-FileHash $_.FullName).Hash } | Sort-Object
          if (Compare-Object $a $b) { throw 'extracted files differ' }
          & $cli info smoke/test.osa

      - uses: actions/upload-artifact@v6
        with:
          name: osmium-${{ matrix.arch }}
          path: |
            artifacts/installer/*.exe
            artifacts/*.zip
            artifacts/osmium-*.exe
            artifacts/*.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        if: matrix.arch == 'x64' && always()
        with:
          name: ui-selftest-screenshots
          path: artifacts/selftest/

  # The arm64 leg above is cross-built on x64 (it makes the arm64 installer and ZIP); this job runs on ARM64 itself.
  arm64:
    name: Windows ARM64 (native)
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5
      # PowerShell on the ARM64 runner image occasionally crashes at startup ("Internal CLR error" in its taskbar
      # jump list) while setup-dotnet runs its installer; one retry gets past it.
      - id: dotnet
        uses: actions/setup-dotnet@v5
        continue-on-error: true
        with:
          global-json-file: global.json
      - if: steps.dotnet.outcome == 'failure'
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Osmium.sln -c Release

      - name: Test
        run: |
          dotnet test -c Release --project tests/Osmium.Core.Tests; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet test -c Release --project tests/Osmium.Desktop.Tests; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet test -c Release --project tests/Osmium.Cli.Tests; if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Publish (no installer)
        shell: pwsh
        run: ./build/publish.ps1 -Arch arm64 -SkipInstaller

      - name: CLI smoke test (compress, test, extract, compare)
        shell: pwsh
        run: |
          $cli = "artifacts/publish/win-arm64/osmium.exe"
          New-Item -ItemType Directory -Force smoke/in/sub | Out-Null
          Copy-Item README.md, docs/*.md smoke/in/
          Copy-Item artifacts/publish/win-arm64/Osmium.Core.dll smoke/in/sub/
          & $cli a smoke/test.osa smoke/in --profile max; if ($LASTEXITCODE) { throw 'compress failed' }
          & $cli t smoke/test.osa; if ($LASTEXITCODE) { throw 'test failed' }
          & $cli x smoke/test.osa smoke/out; if ($LASTEXITCODE) { throw 'extract failed' }
          $a = Get-ChildItem -Recurse -File smoke/in | ForEach-Object { (Get-FileHash $_.FullName).Hash } | Sort-Object
          $b = Get-ChildItem -Recurse -File smoke/out/in | ForEach-Object { (Get-FileHash $_.FullName).Hash } | Sort-Object
          if (Compare-Object $a $b) { throw 'extracted files differ' }
          & $cli info smoke/test.osa

  # The x64 self-test's screenshots on the orphan branch "screenshots", for tools/site/fetch_screenshots.py.
  # Only when requested by hand, for the branch the run was started on (never on pull requests or ordinary pushes);
  # each run replaces the branch with
  # one commit naming its source. Delete the branch after importing the screenshots.
  screenshots:
    name: Publish UI screenshots
    needs: windows
    if: github.event_name == 'workflow_dispatch' && inputs.screenshots
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: screenshots
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ui-selftest-screenshots
          path: screenshots
      - name: Force-push to the screenshots branch
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cd screenshots
          ls -l
          test -f manifest.json || { echo "::error::the self-test artifact has no manifest.json"; exit 1; }
          git init -q -b screenshots
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "UI self-test screenshots of $SHA" -m "Rendered by $RUN_URL"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${REPO}.git" HEAD:refs/heads/screenshots

  release:
    name: Release
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write       # signs the provenance attestation (Sigstore)
      attestations: write   # stores it with the repository
    env:
      TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: osmium-*
          path: dist
          merge-multiple: true
      - name: Checksums
        # The artifacts keep their folder layout (installer/…); release assets are flat.
        run: |
          find dist -mindepth 2 -type f -exec mv -t dist {} +
          find dist -mindepth 1 -type d -empty -delete
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Build provenance for every download
        # Proves each file was built by this workflow from this repository at this commit. Check a download with:
        #   gh attestation verify <file> --repo windfastt/osmium
        # A release is never published without it: if this step fails, the release step does not run.
        uses: actions/attest@v4
        with:
          subject-path: dist/*
      - name: Release notes from CHANGELOG.md
        # The section "## [x.y.z] ..." for the tag's version, with hard-wrapped list items joined back into one line.
        run: |
          awk -v v="${TAG#v}" '
            $0 ~ "^## \\[" v "\\]" { f = 1; next }
            /^## \[/ { f = 0 }
            !f { next }
            /^  +[^ ]/ && buf != "" { sub(/^ +/, " "); buf = buf $0; next }
            { if (started) print buf; buf = $0; started = 1 }
            END { if (started) print buf }' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then cat notes.md; else echo "::warning::CHANGELOG.md has no section for ${TAG#v}"; fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Works both for a pushed tag and for a release published in GitHub's UI ("create new tag on publish"):
        # an existing release gets the files attached and its notes replaced by the CHANGELOG section.
        run: |
          pre=""; [[ "$TAG" == *-* ]] && pre="--prerelease"
          title="Osmium ${TAG#v}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            if [ -s notes.md ]; then gh release edit "$TAG" --title "$title" --notes-file notes.md $pre; fi
          else
            if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$title" "${notes[@]}" $pre
          fi
