name: CI

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  linux:
    name: Build & test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build Osmium.sln -c Release
      - run: dotnet test -c Release --project tests/Osmium.Core.Tests
      - run: dotnet test -c Release --project tests/Osmium.Desktop.Tests

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version
        shell: pwsh
        run: |
          $base = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Select-Object -First 1
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.Substring(1) } else { $v = "$base-ci.$env:GITHUB_RUN_NUMBER" }
          "VER=$v" >> $env:GITHUB_ENV

      - name: Build
        run: dotnet build Osmium.sln -c Release -p:Version=${{ env.VER }}

      # Same tests as Linux, on Windows: includes the CM golden hash, proving byte-identical output across OSes.
      - name: Test
        if: matrix.arch == 'x64'
        run: |
          dotnet test -c Release --project tests/Osmium.Core.Tests
          dotnet test -c Release --project tests/Osmium.Desktop.Tests

      - name: Publish, portable ZIP, installer
        shell: pwsh
        run: ./build/publish.ps1 -Arch ${{ matrix.arch }} -Version $env:VER

      - name: UI self-test (renders every page, light and dark)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $exe = "artifacts/publish/win-x64/Osmium.App.exe"
          foreach ($mode in @('', 'dark')) {
            $argv = @('--selftest-ui', 'artifacts/selftest') + @($mode | Where-Object { $_ })
            $p = Start-Process -FilePath $exe -ArgumentList $argv -Wait -PassThru
            Get-Content artifacts/selftest/selftest.log
            if ($p.ExitCode -ne 0) { throw "UI self-test failed ($mode): exit $($p.ExitCode)" }
          }

      - name: CLI smoke test (compress, test, extract, compare)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $cli = "artifacts/publish/win-x64/osmium.exe"
          New-Item -ItemType Directory -Force smoke/in/sub | Out-Null
          Copy-Item README.md, docs/*.md smoke/in/
          Copy-Item artifacts/publish/win-x64/Osmium.Core.dll smoke/in/sub/
          & $cli a smoke/test.osa smoke/in --profile max; if ($LASTEXITCODE) { throw 'compress failed' }
          & $cli t smoke/test.osa; if ($LASTEXITCODE) { throw 'test failed' }
          & $cli x smoke/test.osa smoke/out; if ($LASTEXITCODE) { throw 'extract failed' }
          $a = Get-ChildItem -Recurse -File smoke/in | ForEach-Object { (Get-FileHash $_.FullName).Hash } | Sort-Object
          $b = Get-ChildItem -Recurse -File smoke/out/in | ForEach-Object { (Get-FileHash $_.FullName).Hash } | Sort-Object
          if (Compare-Object $a $b) { throw 'extracted files differ' }
          & $cli info smoke/test.osa

      - uses: actions/upload-artifact@v4
        with:
          name: osmium-${{ matrix.arch }}
          path: |
            artifacts/installer/*.exe
            artifacts/*.zip
            artifacts/osmium-*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'x64' && always()
        with:
          name: ui-selftest-screenshots
          path: artifacts/selftest/

  release:
    name: Release
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: osmium-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        # The section "## [x.y.z] ..." for the tag's version, with hard-wrapped list items joined back into one line.
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" v "\\]" { f = 1; next }
            /^## \[/ { f = 0 }
            !f { next }
            /^  +[^ ]/ && buf != "" { sub(/^ +/, " "); buf = buf $0; next }
            { if (started) print buf; buf = $0; started = 1 }
            END { if (started) print buf }' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then cat notes.md; else echo "::warning::CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"; fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Works both for a pushed tag and for a release published in GitHub's UI ("create new tag on publish"):
        # an existing release gets the files attached and its notes replaced by the CHANGELOG section.
        run: |
          pre=""; [[ "$GITHUB_REF_NAME" == *-* ]] && pre="--prerelease"
          title="Osmium ${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            if [ -s notes.md ]; then gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file notes.md $pre; fi
          else
            if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
            gh release create "$GITHUB_REF_NAME" dist/* --title "$title" "${notes[@]}" $pre
          fi
