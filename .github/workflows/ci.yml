name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach a build of this commit to an existing release, e.g. v0.1.1 (leave empty for a normal CI run)'
        required: false
        default: ''
      screenshots:
        description: 'Publish the UI self-test screenshots to the "screenshots" branch (for tools/site/fetch_screenshots.py)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  linux:
    name: Build & test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet build Osmium.sln -c Release
      - run: dotnet test -c Release --project tests/Osmium.Core.Tests
      - run: dotnet test -c Release --project tests/Osmium.Desktop.Tests
      - run: dotnet test -c Release --project tests/Osmium.Cli.Tests
      - name: Product page matches tools/site (python3 tools/site/build.py regenerates it)
        run: python3 tools/site/build.py --check
      - name: Settings reference matches the code (tools/settingsdoc regenerates docs/SETTINGS.md)
        run: dotnet run --project tools/settingsdoc -c Release -- --check

      - name: Archive tools for the format checks
        run: |
          tools="tar gzip bzip2 xz zstd zip unzip 7z diff cmp python3"
          missing=""
          for t in $tools; do command -v "$t" > /dev/null || missing="$missing $t"; done
          if [ -n "$missing" ]; then
            echo "Installing:$missing"
            sudo apt-get update -q && sudo apt-get install -y -q zip unzip 7zip zstd xz-utils bzip2
          fi
          for t in $tools; do
            command -v "$t" > /dev/null || { echo "::error::'$t' is not installed, so the archive format checks cannot run"; exit 1; }
          done
          7z | head -2; xz --version | head -1; zstd --version; tar --version | head -1; zip -v | sed -n 2p

      # Archives written by the standard tools, read by osmium: list, test, extract, and compare with the originals.
      - name: CLI smoke test with other archive formats
        run: |
          set -euo pipefail
          osmium() { dotnet "$GITHUB_WORKSPACE/src/Osmium.Cli/bin/Release/net10.0/osmium.dll" "$@"; }
          w=$(mktemp -d)
          # A ZIP written by osmium, checked by Info-ZIP's unzip (an independent reader).
          if out=$(osmium a "$w/smoke.zip" docs -q 2>&1); then
            unzip -tq "$w/smoke.zip"
          elif grep -q "Writing ZIP files is not available yet" <<< "$out"; then
            echo "::warning::waiting for the ZIP writer: osmium a x.zip was not checked"
          else
            echo "$out"; exit 1
          fi
          # A small generated folder: text, random bytes, an empty file, an empty folder, a non-ASCII name.
          mkdir -p "$w/src/tree/sub/empty"
          seq 1 20000 > "$w/src/tree/numbers.txt"
          head -c 300000 /dev/urandom > "$w/src/tree/sub/random.bin"
          : > "$w/src/tree/empty.txt"
          printf 'non-ASCII name\n' > "$w/src/tree/sub/ünïcödé.txt"
          cd "$w/src"
          tar czf ../tree.tar.gz tree
          tar cjf ../tree.tar.bz2 tree
          tar cJf ../tree.tar.xz tree
          tar --zstd -cf ../tree.tar.zst tree
          zip -qr ../tree.zip tree
          7z a -bso0 -bsp0 ../tree.7z tree
          cd "$w"
          for a in tree.tar.gz tree.tar.bz2 tree.tar.xz tree.tar.zst tree.zip tree.7z; do
            echo "== $a"
            osmium l "$a"
            osmium t "$a"
            osmium x "$a" "out-$a" -q
            diff -r src/tree "out-$a/tree"
          done
          cp src/tree/numbers.txt single.txt
          gzip -k single.txt; bzip2 -k single.txt; xz -k single.txt; zstd -q -k single.txt
          for ext in gz bz2 xz zst; do
            echo "== single.txt.$ext"
            osmium l "single.txt.$ext"
            osmium t "single.txt.$ext"
            osmium x "single.txt.$ext" "out-$ext" -q
            cmp single.txt "out-$ext/single.txt"
          done

      # Every committed test fixture is made again from the command in Fixtures/README.md and compared with the
      # committed file: the same listing and the same content (encrypted archives differ byte for byte: random salt).
      - name: Test fixtures match their documented commands
        run: |
          python3 - <<'EOF'
          import os, pathlib, re, subprocess, sys, tempfile
          root = pathlib.Path("tests/Osmium.Core.Tests/Fixtures").resolve()
          readme = (root / "README.md").read_text(encoding="utf-8")
          work = pathlib.Path(tempfile.mkdtemp())
          env = dict(os.environ, TZ="UTC", LC_ALL="C.UTF-8")
          content = re.search(r"```sh\n(.*?)```", readme, re.S).group(1)
          subprocess.run(["bash", "-e", "-c", content], cwd=work, env=env, check=True)
          rows, s, folder = [], "", None
          for line in readme.splitlines():
              m = re.match(r"## .*\(`(\w+)/`\)", line)
              if m: folder, s = m.group(1), ""
              m = re.match(r'With `S="([^"]*)"`', line)
              if m: s = m.group(1)
              m = re.match(r"\| `([^`]+)` \| `(.+)` \|$", line)
              if m and folder: rows.append((folder, m.group(1), m.group(2).replace("\\|", "|"), s))
          committed = sorted(p.relative_to(root).as_posix() for p in root.rglob("*") if p.is_file() and p.suffix != ".md")
          made = sorted(f"{f}/{n}" for f, n, _, _ in rows)
          if made != committed:
              sys.exit(f"fixtures without a command, or commands without a fixture: {sorted(set(made) ^ set(committed))}")
          for f, _, cmd, s in rows:
              (work / f).mkdir(exist_ok=True)
              subprocess.run(["bash", "-e", "-o", "pipefail", "-c", f'S="{s}"; {cmd}'], cwd=work, env=env, check=True)

          def run(*args):
              return subprocess.run(args, capture_output=True, env=env)

          def password(cmd):
              m = re.search(r"'-p([^']*)'|-p'([^']*)'|-P '([^']*)'|-p(\S+)", cmd)
              return next((g for g in m.groups() if g), "") if m else ""

          failures = []
          for f, name, cmd, _ in rows:
              rel = f"{f}/{name}"
              a, b = root / rel, work / rel
              pw = password(cmd)
              if name.endswith(".tar.xz"):
                  if run("tar", "-tvJf", str(a)).stdout != run("tar", "-tvJf", str(b)).stdout: failures.append(f"{rel}: listing differs")
                  if run("xz", "-dc", str(a)).stdout != run("xz", "-dc", str(b)).stdout: failures.append(f"{rel}: content differs")
                  continue
              if name.endswith(".xz"):
                  if run("xz", "-dc", str(a)).stdout != run("xz", "-dc", str(b)).stdout: failures.append(f"{rel}: content differs")
                  def totals(p):
                      out = run("xz", "--robot", "-l", str(p)).stdout.decode()
                      return [l.split("\t")[i] for l in out.splitlines() if l.startswith("totals") for i in (1, 2, 4, 6)]
                  if totals(a) != totals(b): failures.append(f"{rel}: streams, blocks, size or check differ")
                  continue
              ea, eb = work / ("a-" + rel.replace("/", "_")), work / ("b-" + rel.replace("/", "_"))
              if cmd.startswith("zip "):
                  # Made by Info-ZIP: read by Info-ZIP (its password bytes are UTF-8 here).
                  la = run("unzip", "-l", str(a)).stdout.splitlines()[1:]
                  lb = run("unzip", "-l", str(b)).stdout.splitlines()[1:]
                  if la != lb: failures.append(f"{rel}: listing differs")
                  for archive, into in ((a, ea), (b, eb)):
                      r = run("unzip", "-q", *(["-P", pw] if pw else []), str(archive), "-d", str(into))
                      if r.returncode: failures.append(f"{rel}: {r.stderr.decode()}")
              else:
                  keep = (b"Path = ", b"Size = ", b"CRC = ", b"Encrypted = ", b"Method = ", b"Folder = ")
                  def listing(p):
                      out = run("7z", "l", "-slt", *([f"-p{pw}"] if pw else []), str(p)).stdout.split(b"----------", 1)[-1]
                      return [l for l in out.splitlines() if l.startswith(keep)]
                  if listing(a) != listing(b): failures.append(f"{rel}: listing differs")
                  for archive, into in ((a, ea), (b, eb)):
                      r = run("7z", "x", "-bso0", "-bsp0", *([f"-p{pw}"] if pw else []), f"-o{into}", str(archive))
                      if r.returncode: failures.append(f"{rel}: {r.stderr.decode()}")
              if run("diff", "-r", str(ea), str(eb)).returncode: failures.append(f"{rel}: content differs")
          if failures: sys.exit("\n".join(failures))
          print(f"{len(rows)} fixtures match their commands")
          EOF

      # THIRD-PARTY-NOTICES.md must follow the packages: plain checks, the notices themselves are written by hand.
      - name: Third-party notices match the packages
        run: |
          set -euo pipefail
          n=THIRD-PARTY-NOTICES.md
          fail() { echo "::error file=$n::$1"; exit 1; }
          v=$(grep -oP '<PackageReference Include="SharpCompress" Version="\K[^"]+' src/Osmium.Core/Osmium.Core.csproj)
          grep -q "^## SharpCompress $v\$" "$n" || fail "SharpCompress $v (Osmium.Core.csproj) has no section in $n"
          grep -q "^| SharpCompress | $v |" "$n" || fail "the table row of SharpCompress does not say $v"
          grep -hoP '<PackageReference Include="\K[^"]+" Version="[^"]+' src/*/*.csproj | sort -u | while IFS= read -r ref; do
            name=${ref%%\"*}; ver=${ref##*\"}
            grep -qE "^## ${name//./\\.} ${ver//./\\.}( |\$)" "$n" || fail "$name $ver has no section in $n"
          done
          while IFS= read -r h; do
            grep -qxF "$h" "$n" || fail "missing heading: $h"
          done <<'HEADINGS'
          ### SharpCompress: Zstandard (`Compressors/ZStandard/`)
          ### SharpCompress: Deflate, zlib and GZip (`Compressors/Deflate/`)
          ### SharpCompress: Deflate64 (`Compressors/Deflate64/`)
          ### SharpCompress: BZip2 (`Compressors/BZip2/`)
          ### SharpCompress: Adler-32 (`Algorithms/Adler32.cs`)
          ### SharpCompress: Explode (`Compressors/Explode/`)
          ### SharpCompress: RAR decoders (`Compressors/Rar/`, `Compressors/PPMd/H/`)
          ### SharpCompress: PPMd (`Compressors/PPMd/I1/`, `Compressors/PPMd/H/`)
          ### SharpCompress: LZW (`Compressors/Lzw/LzwStream.cs`)
          ### SharpCompress: ADC (`Compressors/ADC/`)
          ### SharpCompress: other credits
          HEADINGS
          section() { awk -v h="$1" 'index($0, h) == 1 { f = 1; next } /^##/ { f = 0 } f' "$n"; }
          section "### SharpCompress: LZW" | grep -q "SharpZipLib" || fail "the LZW section does not name SharpZipLib"
          section "### SharpCompress: BZip2" | grep -q "This product includes software developed at" || fail "the BZip2 section lacks Apache Ant's NOTICE"
          section "### SharpCompress: BZip2" | grep -q "The Apache Software Foundation" || fail "the BZip2 section lacks Apache Ant's NOTICE"
          if grep -q "No separate NOTICE file ships with the SharpCompress source" "$n"; then fail "the old sentence about a missing NOTICE file is still there"; fi
          echo "notices match the packages"

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SCREENSHOTS: ${{ inputs.screenshots }}
        run: |
          $base = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Select-Object -First 1
          if ($env:RELEASE_TAG -match '^v\d') { $v = $env:RELEASE_TAG.Substring(1) }
          elseif ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.Substring(1) }
          elseif ($env:SCREENSHOTS -eq 'true') { $v = $base }   # screenshots for the product page show the plain version
          else { $v = "$base-ci.$env:GITHUB_RUN_NUMBER" }
          "VER=$v" >> $env:GITHUB_ENV

      - name: Build
        run: dotnet build Osmium.sln -c Release -p:Version=${{ env.VER }}

      # Same tests as Linux, on Windows: includes the CM golden hash, proving byte-identical output across OSes.
      # (pwsh only fails a step on the last command's exit code, so each one is checked.)
      - name: Test
        if: matrix.arch == 'x64'
        run: |
          dotnet test -c Release --project tests/Osmium.Core.Tests; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet test -c Release --project tests/Osmium.Desktop.Tests; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet test -c Release --project tests/Osmium.Cli.Tests; if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Publish, portable ZIP, installer
        shell: pwsh
        run: ./build/publish.ps1 -Arch ${{ matrix.arch }} -Version $env:VER

      # Real work on a generated sample folder (Analyze, a max job, Lab, Tune), every page and dialog rendered to PNG
      # with manifest.json / manifest-dark.json; the screenshots job below publishes them for the product page.
      - name: UI self-test (real work, every page and dialog, light and dark)
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 30
        run: |
          $exe = "artifacts/publish/win-x64/Osmium.App.exe"
          foreach ($mode in @('', 'dark')) {
            $argv = @('--selftest-ui', 'artifacts/selftest') + @($mode | Where-Object { $_ })
            $p = Start-Process -FilePath $exe -ArgumentList $argv -Wait -PassThru
            $log = if ($mode) { "artifacts/selftest/selftest-$mode.log" } else { 'artifacts/selftest/selftest.log' }
            if (Test-Path $log) { Get-Content $log } else { Write-Host "::warning::$log was not written" }
            if ($p.ExitCode -ne 0) { throw "UI self-test failed ($mode): exit $($p.ExitCode)" }
          }
          Get-ChildItem artifacts/selftest | Format-Table Name, Length

      - name: CLI smoke test (compress, test, extract, compare)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $cli = "artifacts/publish/win-x64/osmium.exe"
          New-Item -ItemType Directory -Force smoke/in/sub | Out-Null
          Copy-Item README.md, docs/*.md smoke/in/
          Copy-Item artifacts/publish/win-x64/Osmium.Core.dll smoke/in/sub/
          & $cli a smoke/test.osa smoke/in --profile max; if ($LASTEXITCODE) { throw 'compress failed' }
          & $cli t smoke/test.osa; if ($LASTEXITCODE) { throw 'test failed' }
          & $cli x smoke/test.osa smoke/out; if ($LASTEXITCODE) { throw 'extract failed' }
          $a = Get-ChildItem -Recurse -File smoke/in | ForEach-Object { (Get-FileHash $_.FullName).Hash } | Sort-Object
          $b = Get-ChildItem -Recurse -File smoke/out/in | ForEach-Object { (Get-FileHash $_.FullName).Hash } | Sort-Object
          if (Compare-Object $a $b) { throw 'extracted files differ' }
          & $cli info smoke/test.osa

      - name: CLI smoke test with ZIP files (Windows' own ZIP tools and other readers)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $cli = "artifacts/publish/win-x64/osmium.exe"
          $w = "zipsmoke"
          New-Item -ItemType Directory -Force "$w/in/sub" | Out-Null
          Copy-Item README.md, docs/*.md "$w/in/"
          Copy-Item artifacts/publish/win-x64/Osmium.Core.dll "$w/in/sub/"
          function Hashes($root) {
            $base = (Resolve-Path $root).Path
            Get-ChildItem -Recurse -File $root | ForEach-Object { "$([IO.Path]::GetRelativePath($base, $_.FullName))|$((Get-FileHash $_.FullName).Hash)" } | Sort-Object
          }
          # A ZIP made by PowerShell's Compress-Archive, extracted by osmium.
          Compress-Archive -Path "$w/in/*" -DestinationPath "$w/powershell.zip"
          & $cli x "$w/powershell.zip" "$w/from-powershell" -q; if ($LASTEXITCODE) { throw 'osmium x of a Compress-Archive ZIP failed' }
          if (Compare-Object (Hashes "$w/in") (Hashes "$w/from-powershell")) { throw 'files extracted from the Compress-Archive ZIP differ' }
          # A ZIP made by osmium, read by three other readers.
          $out = & $cli a "$w/osmium.zip" "$w/in" 2>&1
          if ($LASTEXITCODE -and "$out" -match 'Writing ZIP files is not available yet') { Write-Host '::warning::waiting for the ZIP writer: osmium a x.zip was not checked'; exit 0 }
          if ($LASTEXITCODE) { throw "osmium a x.zip failed: $out" }
          # tar.exe is libarchive's bsdtar, part of Windows: a reader independent of .NET.
          tar.exe -tf "$w/osmium.zip"; if ($LASTEXITCODE) { throw 'tar.exe could not read the ZIP' }
          # 7-Zip, installed on the runner: an independent reader that checks every file's CRC.
          & "C:\Program Files\7-Zip\7z.exe" t "$w/osmium.zip"; if ($LASTEXITCODE) { throw '7-Zip found a problem in the ZIP' }
          # Expand-Archive reads with .NET's own ZIP code, the code family that wrote it: a round trip, not an
          # independent check.
          Expand-Archive "$w/osmium.zip" "$w/expanded"
          if (Compare-Object (Hashes "$w/in") (Hashes "$w/expanded/in")) { throw 'files expanded from the osmium ZIP differ' }

      - uses: actions/upload-artifact@v6
        with:
          name: osmium-${{ matrix.arch }}
          path: |
            artifacts/installer/*.exe
            artifacts/*.zip
            artifacts/osmium-*.exe
            artifacts/*.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        if: matrix.arch == 'x64' && always()
        with:
          name: ui-selftest-screenshots
          path: artifacts/selftest/

  # The arm64 leg above is cross-built on x64 (it makes the arm64 installer and ZIP); this job runs on ARM64 itself.
  arm64:
    name: Windows ARM64 (native)
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5
      # PowerShell on the ARM64 runner image occasionally crashes at startup ("Internal CLR error" in its taskbar
      # jump list) while setup-dotnet runs its installer; one retry gets past it.
      - id: dotnet
        uses: actions/setup-dotnet@v5
        continue-on-error: true
        with:
          global-json-file: global.json
      - if: steps.dotnet.outcome == 'failure'
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Osmium.sln -c Release

      - name: Test
        run: |
          dotnet test -c Release --project tests/Osmium.Core.Tests; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet test -c Release --project tests/Osmium.Desktop.Tests; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet test -c Release --project tests/Osmium.Cli.Tests; if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Publish (no installer)
        shell: pwsh
        run: ./build/publish.ps1 -Arch arm64 -SkipInstaller

      - name: CLI smoke test (compress, test, extract, compare)
        shell: pwsh
        run: |
          $cli = "artifacts/publish/win-arm64/osmium.exe"
          New-Item -ItemType Directory -Force smoke/in/sub | Out-Null
          Copy-Item README.md, docs/*.md smoke/in/
          Copy-Item artifacts/publish/win-arm64/Osmium.Core.dll smoke/in/sub/
          & $cli a smoke/test.osa smoke/in --profile max; if ($LASTEXITCODE) { throw 'compress failed' }
          & $cli t smoke/test.osa; if ($LASTEXITCODE) { throw 'test failed' }
          & $cli x smoke/test.osa smoke/out; if ($LASTEXITCODE) { throw 'extract failed' }
          $a = Get-ChildItem -Recurse -File smoke/in | ForEach-Object { (Get-FileHash $_.FullName).Hash } | Sort-Object
          $b = Get-ChildItem -Recurse -File smoke/out/in | ForEach-Object { (Get-FileHash $_.FullName).Hash } | Sort-Object
          if (Compare-Object $a $b) { throw 'extracted files differ' }
          & $cli info smoke/test.osa

  # The x64 self-test's screenshots on the orphan branch "screenshots", for tools/site/fetch_screenshots.py.
  # Only when requested by hand, for the branch the run was started on (never on pull requests or ordinary pushes);
  # each run replaces the branch with
  # one commit naming its source. Delete the branch after importing the screenshots.
  screenshots:
    name: Publish UI screenshots
    needs: windows
    if: github.event_name == 'workflow_dispatch' && inputs.screenshots
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: screenshots
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ui-selftest-screenshots
          path: screenshots
      - name: Force-push to the screenshots branch
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cd screenshots
          ls -l
          test -f manifest.json || { echo "::error::the self-test artifact has no manifest.json"; exit 1; }
          git init -q -b screenshots
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "UI self-test screenshots of $SHA" -m "Rendered by $RUN_URL"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${REPO}.git" HEAD:refs/heads/screenshots

  release:
    name: Release
    needs: [linux, windows, arm64]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write       # signs the provenance attestation (Sigstore)
      attestations: write   # stores it with the repository
    env:
      TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: osmium-*
          path: dist
          merge-multiple: true
      - name: Checksums
        # The artifacts keep their folder layout (installer/…); release assets are flat.
        run: |
          find dist -mindepth 2 -type f -exec mv -t dist {} +
          find dist -mindepth 1 -type d -empty -delete
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Build provenance for every download
        # Proves each file was built by this workflow from this repository at this commit. Check a download with:
        #   gh attestation verify <file> --repo windfastt/osmium
        # A release is never published without it: if this step fails, the release step does not run.
        uses: actions/attest@v4
        with:
          subject-path: dist/*
      - name: Release notes from CHANGELOG.md
        # The section "## [x.y.z] ..." for the tag's version, with hard-wrapped list items joined back into one line.
        run: |
          awk -v v="${TAG#v}" '
            $0 ~ "^## \\[" v "\\]" { f = 1; next }
            /^## \[/ { f = 0 }
            !f { next }
            /^  +[^ ]/ && buf != "" { sub(/^ +/, " "); buf = buf $0; next }
            { if (started) print buf; buf = $0; started = 1 }
            END { if (started) print buf }' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then cat notes.md; else echo "::warning::CHANGELOG.md has no section for ${TAG#v}"; fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Works both for a pushed tag and for a release published in GitHub's UI ("create new tag on publish"):
        # an existing release gets the files attached and its notes replaced by the CHANGELOG section.
        # A run started by hand with release_tag may find the tag made in advance on an earlier commit: the tag is
        # moved to the commit this run built, so the release's source and its files always match, and a draft
        # release is published.
        run: |
          pre=""; [[ "$TAG" == *-* ]] && pre="--prerelease"
          title="Osmium ${TAG#v}"
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            tagged=$(git ls-remote origin "refs/tags/$TAG^{}" "refs/tags/$TAG" | awk 'NR==1 {print $1}')
            if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "Moving $TAG from $tagged to $GITHUB_SHA"
              git push --force origin "$GITHUB_SHA:refs/tags/$TAG"
            fi
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            if [ -s notes.md ]; then gh release edit "$TAG" --title "$title" --notes-file notes.md $pre; fi
            gh release edit "$TAG" --draft=false
          else
            if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$title" "${notes[@]}" $pre
          fi
