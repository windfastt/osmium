<!-- Social preview card for the GitHub repository (Settings > General > Social preview), 1280x640.
     Render with Chromium at a 1280x640 viewport, deviceScaleFactor 1, and save as docs/img/social-preview.png.
     Fonts are the site's self-hosted OFL fonts in docs/fonts. -->
<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Anybody;src:url(../../docs/fonts/anybody-latin.woff2) format("woff2");font-weight:100 900;font-stretch:50% 150%}
@font-face{font-family:"Instrument Sans";src:url(../../docs/fonts/instrument-sans-latin.woff2) format("woff2");font-weight:400 700;font-stretch:75% 100%}
@font-face{font-family:"Martian Mono";src:url(../../docs/fonts/martian-mono-latin.woff2) format("woff2");font-weight:100 800;font-stretch:75% 112.5%}
*{margin:0;box-sizing:border-box}
html,body{width:1280px;height:640px;overflow:hidden}
body{background:#0e0f13;color:#eceef4;font-family:"Instrument Sans",system-ui,sans-serif;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(900px 520px at 78% 18%,rgba(58,42,150,.55),transparent 60%),radial-gradient(700px 480px at 12% 95%,rgba(20,160,210,.28),transparent 60%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:40px 40px;mask-image:radial-gradient(800px 500px at 50% 50%,#000,transparent 75%)}
.wrap{position:absolute;inset:0;padding:84px 96px;display:flex;flex-direction:column;justify-content:space-between}
.brand{display:flex;align-items:center;gap:22px}
.brand svg{width:76px;height:76px;filter:drop-shadow(0 10px 28px rgba(58,42,150,.55))}
.name{font-family:Anybody,sans-serif;font-weight:800;font-stretch:112%;font-size:58px;letter-spacing:-.5px}
h1{font-family:Anybody,sans-serif;font-weight:800;font-stretch:95%;font-size:86px;line-height:.98;letter-spacing:-1.5px;max-width:1000px}
h1 .soft{color:#b3a9ff}
.sub{font-size:26px;line-height:1.38;color:#c3c6d1;max-width:960px;margin-top:26px}
.chips{display:flex;gap:10px;flex-wrap:nowrap}
.chip{font-family:"Martian Mono",monospace;font-size:15px;font-stretch:84%;white-space:nowrap;color:#c3c6d1;border:1px solid #2a2c35;background:rgba(23,24,30,.75);border-radius:99px;padding:9px 15px}
.chip b{color:#eceef4;font-weight:600}
</style></head><body><div class="glow"></div><div class="grid"></div><div class="wrap">
<div class="brand"><svg viewBox="0 0 32 32"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a2a96"/><stop offset="1" stop-color="#14a0d2"/></linearGradient></defs><rect x="1.3" y="1.3" width="29.4" height="29.4" rx="7" fill="url(#g)"/><polygon points="16,5.8 25.1,11 16,16.3 6.9,11" fill="#f0f4ff"/><polygon points="25.1,11 25.1,21.6 16,26.9 16,16.3" fill="#aab6d7"/><polygon points="6.9,11 16,16.3 16,26.9 6.9,21.6" fill="#7884af"/></svg><span class="name">Osmium</span></div>
<div><h1>As small as <span class="soft">you have time for.</span></h1>
<p class="sub">A Windows file compressor that works out what each file is and plans a compression pipeline for it. Free and open source under the MIT License.</p></div>
<div class="chips"><span class="chip"><b>7 profiles</b> · Store to Exhaustive</span><span class="chip"><b>Context mixing</b> · LZMA · PPMd · Zstandard</span><span class="chip"><b>Verified</b> blocks · AES-256-GCM</span></div>
</div></body></html>
