# Upstream sources of the osmium_native library, pinned by SHA-256.
#
# One line per archive, fields separated by spaces:
#   name  version  url  sha256  size-in-bytes  git-tag  git-commit
# fetch_sources.py downloads each archive (or takes it from a cache or a folder), checks its size and SHA-256 before
# anything is extracted, and then checks every extracted file against sources.files. Changing a line here is a new
# encoder generation (see README.md, "Upgrading an upstream library"); a hash is never "just bumped".

